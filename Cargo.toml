[package]
name = "lkjyolo"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Durable native execution bridge for authenticated Coder workspaces"
license = "Apache-2.0"
repository = "https://github.com/lkjsxc/lkjyolo"
default-run = "lkjyolo"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
