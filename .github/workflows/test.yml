name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting and lints
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Fetch pinned execution engine
        run: |
          curl --fail --location --retry 3 -o /tmp/chatgpt-exec-mcp https://github.com/CeraCharlesCC/chatgpt-exec-mcp/releases/download/v0.2.1/chatgpt-exec-mcp-linux-x86_64
          printf '%s  %s\n' 790fc21733c51373d9967931a834325b2e9f49581e3e9187cf7fb54cb62435f6 /tmp/chatgpt-exec-mcp | sha256sum --check
          chmod +x /tmp/chatgpt-exec-mcp
      - name: Run unit and real engine tests
        env:
          LKJYOLO_TEST_ENGINE: /tmp/chatgpt-exec-mcp
        run: |
          cargo test --locked --all-targets
          cargo test --locked --test engine -- --ignored --test-threads=2
      - name: Build executable
        run: |
          cargo build --locked --release
          target/release/lkjyolo package-plugin
