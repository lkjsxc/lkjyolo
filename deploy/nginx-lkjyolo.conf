# Include inside the existing coder.lkjsxc.com TLS server block.
# The Coder routes and OAuth issuer remain served by Coder.
location = /lkjyolo/mcp {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host coder.lkjsxc.com;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 80s;
    proxy_send_timeout 80s;
    client_max_body_size 2m;
    client_body_timeout 15s;
    proxy_buffering off;
    proxy_request_buffering on;
    access_log off;
}
location = /.well-known/oauth-protected-resource/lkjyolo/mcp {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host coder.lkjsxc.com;
    access_log off;
}

# Public onboarding and immutable, checksum-pinned distribution assets.
location = /lkjyolo { return 308 /lkjyolo/; }
location = /lkjyolo/ { alias /srv/lkjyolo-public/index.html; default_type text/html; }
location = /lkjyolo/getting-started.md { alias /srv/lkjyolo-public/getting-started.md; default_type text/plain; }
location ^~ /lkjyolo/releases/ {
    alias /srv/lkjyolo-public/releases/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=86400";
}
location = /lkjyolo/healthz {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host coder.lkjsxc.com;
    access_log off;
}
