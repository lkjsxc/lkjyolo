# Managed by lkjyolo dedicated onboarding domain.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lkjyolo.lkjsxc.com;
    server_tokens off;
    ssl_certificate __FULLCHAIN__;
    ssl_certificate_key __PRIVATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    if ($host != "lkjyolo.lkjsxc.com") { return 421; }
    if ($ssl_server_name != "lkjyolo.lkjsxc.com") { return 421; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
    root /srv/lkjyolo-public;
    index index.html;
    autoindex off;
    location / { try_files $uri $uri/ =404; }
    location = /getting-started.md { default_type text/plain; }
    location ^~ /releases/ { add_header X-Content-Type-Options nosniff always; add_header Cache-Control "public, max-age=86400"; }
}
